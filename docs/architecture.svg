<text x="1005.0" y="448.5" font-size="15" fill="#1e1e1e" text-anchor="middle">sum C_rent &gt;= C_buy</text>
<text x="1005.0" y="466.8" font-size="15" fill="#1e1e1e" text-anchor="middle">-&gt; CREATE INDEX</text>
<text x="70" y="524.2" font-size="15" fill="#1e1e1e" opacity="1.0">Both sides live in the planner's own cost units, which is the whole point - rent and buy are only</text>
<text x="70" y="543.0" font-size="15" fill="#1e1e1e" opacity="1.0">comparable on one scale. Renting until rent equals purchase is the classic 2-competitive strategy:</text>
<text x="70" y="574.2" font-size="15" fill="#1e1e1e" opacity="1.0">worst case you pay twice what an oracle with advance knowledge of the workload would have paid.</text>
